[project]
name = "omniswitch"
dynamic = ["version"]
description = "Your local AI gateway: install, connect a provider, and build."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
sdk = ["openai>=1.0"]

[project.scripts]
omniswitch = "omniswitch.__main__:main"

[project.urls]
Homepage = "https://omniswitch.dev"
Repository = "https://github.com/omniswitch-dev/omniswitch"
Documentation = "https://github.com/omniswitch-dev/omniswitch/blob/main/docs/ONBOARDING.md"
Issues = "https://github.com/omniswitch-dev/omniswitch/issues"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omniswitch*"]

[tool.setuptools.package-data]
omniswitch = ["bin/*"]

[tool.setuptools.dynamic]
version = {attr = "omniswitch._version.__version__"}
