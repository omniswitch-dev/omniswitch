name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: Release binaries, images, and tap
    runs-on: ubuntu-latest
    env:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Install cosign
        # cosign-installer has no rolling v4 ref; pin the current v4 release.
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.54.1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # v2.16+ rejects the existing Homebrew formula in `check`.
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest archives and checksums
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Read published multi-arch manifest digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/omniswitch-dev/omniswitch
          digest=$(jq -er --arg name "${image}:${GITHUB_REF_NAME#v}" '
            [.[] | select(.type == "Docker Manifest" and .name == $name) | .extra.Digest]
            | unique
            | if length == 1 and (.[0] | test("^sha256:[0-9a-f]{64}$")) then .[0]
              else error("expected one published multi-arch manifest digest") end
          ' dist/artifacts.json)
          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest multi-arch image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Avoid granting artifact-metadata:write; provenance does not need
          # the optional artifact storage record.
          create-storage-record: false

      - name: Verify published signatures and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          archive="omniswitch_${GITHUB_REF_NAME#v}_linux_amd64.tar.gz"
          directory="${RUNNER_TEMP}/release-verification"
          mkdir -p "$directory"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir "$directory" --pattern "$archive" --pattern checksums.txt \
            --pattern checksums.txt.sig --pattern checksums.txt.pem
          cd "$directory"
          identity=$(python3 -c 'import os, re; print("^https://github\\.com/" + re.escape(os.environ["GITHUB_REPOSITORY"]) + "/\\.github/workflows/release\\.yml@refs/tags/v.*$")')
          cosign verify-blob checksums.txt \
            --signature checksums.txt.sig --certificate checksums.txt.pem \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --ignore-missing checksums.txt
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF"
          cosign verify "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify "oci://${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" --bundle-from-oci \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF"
