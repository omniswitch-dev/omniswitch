version: 2

project_name: omniswitch

before:
  hooks:
    # Releases must not rewrite the checked-in dependency manifests.
    - go mod download

builds:
  - id: gateway
    main: ./cmd/gateway
    binary: omniswitch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
  - id: policy
    main: ./cmd/omniswitch
    binary: omniswitch-policy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    ids:
      - gateway
      - policy

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.spdx.json"
    cmd: syft
    args:
      - "${artifact}"
      - --output
      - "spdx-json=${document}"

# Keep detached files for users with either cosign v2 or v3. Cosign v3
# defaults to bundle-only signing, so explicitly select its legacy output.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --use-signing-config=false
      - --output-signature
      - "${signature}"
      - --output-certificate
      - "${certificate}"
      - "${artifact}"

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - sign
      - --yes
      - "${artifact}@${digest}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - repository:
      owner: omniswitch-dev
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://omniswitch.dev
    description: Open-source AI gateway, guardrail, and agent-protocol layer
    license: Apache-2.0
    skip_upload: "{{ .Prerelease }}"
    install: |
      bin.install("omniswitch")
      bin.install("omniswitch-policy")
    test: |
      assert_match version.to_s, shell_output("#{bin}/omniswitch version")

dockers:
  - image_templates:
      - ghcr.io/omniswitch-dev/omniswitch:{{ .Version }}-amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - policies
      - examples
    use: buildx
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.source=https://github.com/omniswitch-dev/omniswitch
      - --label=org.opencontainers.image.licenses=Apache-2.0
  - image_templates:
      - ghcr.io/omniswitch-dev/omniswitch:{{ .Version }}-arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - policies
      - examples
    use: buildx
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.source=https://github.com/omniswitch-dev/omniswitch
      - --label=org.opencontainers.image.licenses=Apache-2.0

docker_manifests:
  - name_template: ghcr.io/omniswitch-dev/omniswitch:{{ .Version }}
    image_templates:
      - ghcr.io/omniswitch-dev/omniswitch:{{ .Version }}-amd64
      - ghcr.io/omniswitch-dev/omniswitch:{{ .Version }}-arm64
  - name_template: ghcr.io/omniswitch-dev/omniswitch:latest
    skip_push: auto
    image_templates:
      - ghcr.io/omniswitch-dev/omniswitch:{{ .Version }}-amd64
      - ghcr.io/omniswitch-dev/omniswitch:{{ .Version }}-arm64

release:
  draft: false
  mode: replace
  header: |
    ## OmniSwitch {{ .Tag }}
    Download the archive for your platform, extract, and run:
    `OPENAI_API_KEY=sk-... ./omniswitch serve`
    Docker: `docker run -p 8080:8080 -e OPENAI_API_KEY=sk-... ghcr.io/omniswitch-dev/omniswitch:{{ .Version }}`

