# Default values for the OmniSwitch Helm chart.

replicaCount: 1

image:
  repository: ghcr.io/omniswitch-dev/omniswitch
  tag: ""            # defaults to .Chart.AppVersion (without a leading v)
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Provider credentials. Rendered into a Secret and injected via envFrom.
# Example:
#   secrets:
#     OPENAI_API_KEY: sk-...
#     ANTHROPIC_API_KEY: sk-ant-...
secrets: {}
existingSecret: ""    # use an existing Secret instead of creating one

# Shared Postgres control-plane store. Set ONE of url or existingSecret.
# url creates a separate Secret; prefer existingSecret in production.
# In Postgres mode persistence is ignored and no gateway PVC is rendered.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: database-url

# Gateway configuration (rendered to /config/gateway.yaml).
config:
  apiVersion: omniswitch.dev/v1
  kind: GatewayConfig
  gateway:
    auth: true
    cache_scope: api_key
    log_payloads: false
  # routes: {}
  # guardrails: {}
  # rate_limit: {}
  # identity: {}
  # authorization: {}
  # mcp: {}
  # providers: []

# SQLite requires one replica. Disabled persistence uses an ephemeral emptyDir.
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

redis:
  enabled: false
  url: ""           # external Redis, or inferred chart service when enabled
  image:
    repository: redis
    tag: "7-alpine"
  storage:
    size: 1Gi

observability:
  prometheus:
    enabled: true
    public: false    # anonymous /metrics; only public metrics get scrape annotations
    path: /metrics
    port: http
  otel:
    enabled: false
    endpoint: ""
    serviceName: omniswitch
    insecure: false
    headers: {}       # e.g. authorization: "Bearer ${OTEL_TOKEN}"

# Requires Prometheus Operator CRDs. Private metrics require a viewer-or-higher
# API key in this Secret (in the chart's namespace), not annotation-based scraping.
serviceMonitor:
  enabled: false
  interval: 30s
  additionalLabels: {}
  bearerTokenSecret: {}   # { name: omniswitch-metrics, key: token }

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null   # when set, takes precedence over minAvailable

# Set any probe to null to disable it. Startup allows up to five minutes for
# first-boot database migrations before readiness/liveness probes take over.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 60

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Grace period for in-flight requests (including SSE streams) to drain on
# SIGTERM before Kubernetes force-kills the pod. Keep in sync with
# OMNISWITCH_SHUTDOWN_TIMEOUT (default 30s) plus a safety margin.
terminationGracePeriodSeconds: 45

podAnnotations: {}
podLabels: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

nodeSelector: {}
tolerations: []
affinity: {}
