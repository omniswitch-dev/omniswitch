# Default values for the OmniSwitch Helm chart.

replicaCount: 1

image:
  repository: ghcr.io/omniswitch-dev/omniswitch
  tag: ""            # defaults to .Chart.AppVersion (without a leading v)
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Provider credentials. Rendered into a Secret and injected via envFrom.
# Example:
#   secrets:
#     OPENAI_API_KEY: sk-...
#     ANTHROPIC_API_KEY: sk-ant-...
secrets: {}
existingSecret: ""    # use an existing Secret instead of creating one

# First-start bootstrap admin key. When config.gateway.auth is true, the gateway
# refuses to start until at least one API key exists, so it needs
# OMNISWITCH_BOOTSTRAP_API_KEY on first start. Supply it in secrets or in
# existingSecret. If neither is set, the chart generates a random key in the
# chart Secret (kept across upgrades) when bootstrap.generate is true, and fails
# rendering when it is false.
bootstrap:
  generate: true

# Shared Postgres control-plane store. Set ONE of url or existingSecret.
# url creates a separate Secret; prefer existingSecret in production.
# In Postgres mode persistence is ignored and no gateway PVC is rendered.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: database-url

# Gateway configuration (rendered to /config/gateway.yaml).
config:
  apiVersion: omniswitch.dev/v1
  kind: GatewayConfig
  gateway:
    # Listen on all interfaces inside the pod. Without an explicit address the
    # gateway binds 127.0.0.1 when auth is off, which a Service cannot reach.
    listen: ":8080"
    auth: true
    cache_scope: api_key
    log_payloads: false
  # routes: {}
  # guardrails: {}
  # rate_limit: {}
  # identity: {}
  # authorization: {}
  # mcp: {}
  # providers: []

# SQLite requires one replica. Disabled persistence uses an ephemeral emptyDir.
persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

redis:
  enabled: false
  url: ""           # external Redis, or inferred chart service when enabled
  image:
    repository: redis
    tag: "7-alpine"
  storage:
    size: 1Gi

observability:
  prometheus:
    enabled: true
    public: false    # anonymous /metrics; only public metrics get scrape annotations
    path: /metrics
    port: http
  otel:
    enabled: false
    endpoint: ""
    serviceName: omniswitch
    insecure: false
    # OTLP export headers, rendered as one comma-separated key=value
    # OMNISWITCH_OTEL_HEADERS value in a dedicated Secret. Values must not
    # contain commas. Helm keeps supplied values in its release history, so
    # prefer headersSecret in production.
    headers: {}       # e.g. authorization: "Bearer <token>"
    # Existing Secret whose key holds the full OMNISWITCH_OTEL_HEADERS value,
    # e.g. "authorization=Bearer <token>,x-scope=prod". Takes precedence over
    # headers.
    headersSecret: {}  # { name: otel-headers, key: headers }

# Requires Prometheus Operator CRDs. Private metrics require a viewer-or-higher
# API key in this Secret (in the chart's namespace), not annotation-based scraping.
serviceMonitor:
  enabled: false
  interval: 30s
  additionalLabels: {}
  bearerTokenSecret: {}   # { name: omniswitch-metrics, key: token }

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null   # when set, takes precedence over minAvailable

# Set any probe to null to disable it. Startup allows up to five minutes for
# first-boot database migrations before readiness/liveness probes take over.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 60

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Grace period for in-flight requests (including SSE streams) to drain on
# SIGTERM before Kubernetes force-kills the pod. Keep in sync with
# OMNISWITCH_SHUTDOWN_TIMEOUT (default 30s) plus a safety margin.
terminationGracePeriodSeconds: 45

podAnnotations: {}
podLabels: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

nodeSelector: {}
tolerations: []
affinity: {}
