{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omniswitch.databaseSecretName" . }}
  labels:
    {{- include "omniswitch.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ required "database.existingSecretKey must not be empty" .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
{{- end }}
