{{- if not .Values.existingSecret }}
{{- $name := printf "%s-secrets" (include "omniswitch.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "omniswitch.labels" . | nindent 4 }}
type: Opaque
{{- $generate := eq (include "omniswitch.generateBootstrapKey" .) "true" }}
stringData:
{{- range $key, $value := .Values.secrets }}
{{- /* An empty bootstrap key counts as not supplied; never render it as "". */}}
{{- if not (and (eq $key "OMNISWITCH_BOOTSTRAP_API_KEY") (not $value)) }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
{{- if $generate }}
  {{- /* Reuse the key from an earlier install so upgrades keep it stable. */}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- $key := "" }}
  {{- if and $existing $existing.data (hasKey $existing.data "OMNISWITCH_BOOTSTRAP_API_KEY") }}
  {{- $key = index $existing.data "OMNISWITCH_BOOTSTRAP_API_KEY" | b64dec }}
  {{- else }}
  {{- $key = printf "sk-omniswitch-%s" (randAlphaNum 40) }}
  {{- end }}
  OMNISWITCH_BOOTSTRAP_API_KEY: {{ $key | quote }}
{{- end }}
{{- end }}
{{- if and .Values.observability.otel.enabled .Values.observability.otel.headers (not .Values.observability.otel.headersSecret.name) }}
{{- $pairs := list }}
{{- range $key, $value := .Values.observability.otel.headers }}
{{- if contains "," (toString $value) }}
{{- fail (printf "observability.otel.headers.%s must not contain a comma; use observability.otel.headersSecret instead" $key) }}
{{- end }}
{{- $pairs = append $pairs (printf "%s=%s" $key (toString $value)) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omniswitch.otelHeadersSecretName" . }}
  labels:
    {{- include "omniswitch.labels" . | nindent 4 }}
type: Opaque
stringData:
  headers: {{ join "," $pairs | quote }}
{{- end }}
