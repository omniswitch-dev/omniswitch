apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omniswitch.fullname" . }}
  labels:
    {{- include "omniswitch.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "omniswitch.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "omniswitch.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.observability.prometheus.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.observability.prometheus.path }}
        prometheus.io/port: "8080"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ default (include "omniswitch.fullname" .) .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OMNISWITCH_CONFIG
              value: /config/gateway.yaml
            - name: OMNISWITCH_DATA
              value: /data
            {{- if .Values.observability.otel.enabled }}
            - name: OMNISWITCH_OTEL_ENABLED
              value: "true"
            - name: OMNISWITCH_OTEL_ENDPOINT
              value: {{ .Values.observability.otel.endpoint | quote }}
            - name: OMNISWITCH_OTEL_SERVICE_NAME
              value: {{ .Values.observability.otel.serviceName | quote }}
            - name: OMNISWITCH_OTEL_INSECURE
              value: {{ .Values.observability.otel.insecure | quote }}
            {{- range $key, $value := .Values.observability.otel.headers }}
            - name: OMNISWITCH_OTEL_HEADER_{{ $key | upper | replace "-" "_" }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.redis.enabled }}
            - name: OMNISWITCH_RATE_LIMIT_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "omniswitch.secretName" . }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "omniswitch.fullname" . }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "omniswitch.fullname" . }}-data
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
