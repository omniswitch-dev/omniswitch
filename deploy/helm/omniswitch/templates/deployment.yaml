{{- $postgres := or .Values.database.url .Values.database.existingSecret -}}
{{- if and .Values.database.url .Values.database.existingSecret -}}
{{- fail "set only one of database.url or database.existingSecret" -}}
{{- end -}}
{{- if and (gt (int .Values.replicaCount) 1) (not $postgres) -}}
{{- fail "replicaCount > 1 requires database.url or database.existingSecret; SQLite on a PVC cannot be shared" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omniswitch.fullname" . }}
  labels:
    {{- include "omniswitch.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "omniswitch.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "omniswitch.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.database.url }}
        checksum/database: {{ include (print $.Template.BasePath "/database-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.observability.prometheus.enabled .Values.observability.prometheus.public }}
        # Annotation-based scraping cannot supply a bearer token.
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.observability.prometheus.path | quote }}
        prometheus.io/port: "8080"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 45 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "omniswitch.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OMNISWITCH_CONFIG
              value: /config/gateway.yaml
            - name: OMNISWITCH_DATA
              value: /data
            - name: OMNISWITCH_PROMETHEUS_ENABLED
              value: {{ .Values.observability.prometheus.enabled | quote }}
            - name: OMNISWITCH_METRICS_PUBLIC
              value: {{ .Values.observability.prometheus.public | quote }}
            {{- if $postgres }}
            - name: OMNISWITCH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "omniswitch.databaseSecretName" . }}
                  key: {{ required "database.existingSecretKey must not be empty" .Values.database.existingSecretKey }}
            {{- end }}
            {{- if .Values.observability.otel.enabled }}
            - name: OMNISWITCH_OTEL_ENABLED
              value: "true"
            - name: OMNISWITCH_OTEL_ENDPOINT
              value: {{ .Values.observability.otel.endpoint | quote }}
            - name: OMNISWITCH_OTEL_SERVICE_NAME
              value: {{ .Values.observability.otel.serviceName | quote }}
            - name: OMNISWITCH_OTEL_INSECURE
              value: {{ .Values.observability.otel.insecure | quote }}
            {{- range $key, $value := .Values.observability.otel.headers }}
            - name: OMNISWITCH_OTEL_HEADER_{{ $key | upper | replace "-" "_" }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if or .Values.redis.enabled .Values.redis.url }}
            - name: OMNISWITCH_RATE_LIMIT_REDIS_URL
              value: {{ include "omniswitch.redisURL" . | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "omniswitch.secretName" . }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- if not $postgres }}
            - name: data
              mountPath: /data
            {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "omniswitch.fullname" . }}-config
        {{- if not $postgres }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omniswitch.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
