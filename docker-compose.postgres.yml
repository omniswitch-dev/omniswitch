# Overlay: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
# Use a URI-safe password (for example `openssl rand -hex 32`) in your shell or
# uncommitted .env file. Existing SQLite data is not migrated into Postgres.
services:
  gateway:
    environment:
      OMNISWITCH_DATABASE_URL: "postgres://omniswitch:${OMNISWITCH_POSTGRES_PASSWORD:?Set OMNISWITCH_POSTGRES_PASSWORD}@postgres:5432/omniswitch?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: omniswitch
      POSTGRES_DB: omniswitch
      POSTGRES_PASSWORD: ${OMNISWITCH_POSTGRES_PASSWORD:?Set OMNISWITCH_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - omniswitch-postgres:/var/lib/postgresql/data

volumes:
  omniswitch-postgres:
