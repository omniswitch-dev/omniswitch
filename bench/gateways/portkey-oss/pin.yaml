notes: |
  Portkey's OSS gateway is configured per-request via a Config object, sent
  either as the request body's `config` field or the `x-portkey-config`
  header, rather than a single gateway-wide file the way LiteLLM/OmniSwitch
  are configured. This harness applies the Config via the `x-portkey-config`
  header on every k6 request (see bench/k6/lib/gateways.js), and keeps the
  two JSON Config documents below under version control as the "config
  file" for parity with the other gateways' directory layout.
