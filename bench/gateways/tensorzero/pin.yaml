maintenance_caveat: >
  IMPORTANT: at research time, TensorZero's own website/project statement
  indicated the project is no longer actively maintained. This must be
  flagged prominently in any published comparison including TensorZero --
  do not present its benchmark numbers without this caveat next to them.
  Re-verify current maintenance status immediately before the first
  measured run; if it has resumed active development, update or remove
  this caveat with a fresh source citation and date.
observability_note: >
  TensorZero's ClickHouse-backed observability store is optional and is
  left disabled in both harness cells, matching TensorZero's own published
  perf-benchmark methodology (disabled for their <1ms p99 @ 10k QPS claim).
  This keeps the OmniSwitch harness's "apples to apples" comparison
  consistent with how TensorZero benchmarks itself, but it means
  TensorZero's observability capability is not exercised by these latency
  scenarios -- noted separately in S8 conformance, not S1/S2/S4/S5.
