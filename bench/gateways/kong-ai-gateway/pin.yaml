oss_vs_enterprise_caveat: >
  Kong Gateway OSS 3.9 ships the community `ai-proxy` plugin used here
  (single provider/model, no fallback). The following AI features that
  claims.yaml lists for "Kong AI Gateway" are Kong **Enterprise**-only and
  are NOT exercised by this harness cell, which uses OSS only:
    - Fallback / multi-provider weighted load balancing: "AI Proxy Advanced"
      plugin (Enterprise).
    - Token-aware / model-aware rate limiting: "AI Rate Limiting Advanced"
      plugin (Enterprise).
    - Semantic cache: separate "AI Semantic Cache" plugin; licensing/tier
      unclear at research time, treated as unavailable in this OSS-only
      harness cell.
  These are marked `n/a` (not `no`) in the results matrix for the OSS
  harness cell, with an explicit note that Enterprise plugins exist and
  were not tested -- see NOTES.md.
